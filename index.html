<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El vaquero🤠</title>
    <style>
        * {
            box-sizing: border-box; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #14141e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: monospace;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background-color: #87ceeb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1000 / 700;
        }
    </style>
</head>
<body>

<canvas id="pantalla" width="1000" height="700"></canvas>

<!-- LIBRERÍAS DE FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
// --- CONFIGURACIÓN FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyAfp3v_irQrGEFWkkxN3giYm9Cdi6AHhEk",
    authDomain: "juego-vaquero.firebaseapp.com",
    databaseURL: "https://juego-vaquero-default-rtdb.firebaseio.com", 
    projectId: "juego-vaquero",
    storageBucket: "juego-vaquero.firebasestorage.app",
    messagingSenderId: "118095845477",
    appId: "1:118095845477:web:d65c246b14484718fe4e8c"
};

let database = null;
let auth = null;
let usuarioActual = null;
let listaTops = [
    { nombre: "Jugador1", metros: 120 },
    { nombre: "VaqueroPro", metros: 95 }
];

try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    auth = firebase.auth();
    
    database.ref('scores').orderByChild('metros').limitToLast(5).on('value', (snapshot) => {
        let lista = [];
        snapshot.forEach((childSnapshot) => {
            lista.push(childSnapshot.val());
        });
        if(lista.length > 0) listaTops = lista.reverse();
    });
} catch(e) {
    console.error("Firebase no pudo iniciar, ejecutando en modo local offline:", e);
}

const canvas = document.getElementById("pantalla");
const ctx = canvas.getContext("2d");

// --- CONFIGURACIÓN BASE JUEGO ---
let estado = "LOGIN"; 
let controlTactil = true;
let oro = 1000;
let distRec = 0;
let maxDistGlobal = 0; 
let hp = 100;
let slotSel = 0;
let avisoTxt = { t: "", frames: 0 };

const ALTURA_SUELO = 450;
const TAMANIO_BLOQUE = 50;
const MAPA_ESTRUCTURA = [0, 1, 2, 3, 4];

let pjX = 200;
let pjY = ALTURA_SUELO - 75;
let velX = 0;
let velY = 0;
const GRAVEDAD = 0.6;
let enSuelo = false;
const pjAncho = 55;
const pjAlto = 75;

let hb = ["Espada Madera", "Pico Madera", "Caña de Pescar", "Arco", null, null, null, null, null];
let mochila = ["Flecha", "Flecha", "Flecha", "Poción Vida", "Poción Vida"];
let proyectiles = [];

const INFO_ITEMS = {
    "Espada Madera": { dmg: 60, ico: "⚔️", tipo: "arma" },
    "Pico Madera": { dmg: 30, ico: "⛏️", tipo: "pico" },
    "Caña de Pescar": { ico: "🎣", tipo: "caña" },
    "Arco": { ico: "🏹", tipo: "arco" },
    "Flecha": { ico: "➹", tipo: "ammo" },
    "Poción Vida": { heal: 80, ico: "🧪", tipo: "pocion" },
    "Pez": { heal: 20, ico: "🐟", tipo: "comida" },
    "Piraña": { heal: -15, ico: "🍗", tipo: "comida" }
};

const ENEMIGOS_ICOS = { "ogro": "👹", "flechero": "🏹", "ladron": "🥷", "chulupi": "🪳" };

// --- BOTONES ---
const Y_BOTONES = 700 - 110;
const btnIzq = { x: 30, y: Y_BOTONES, w: 90, h: 80, txt: "◀" };
const btnDer = { x: 140, y: Y_BOTONES, w: 90, h: 80, txt: "▶" };
const btnSalto = { x: 250, y: Y_BOTONES, w: 90, h: 80, txt: "▲" };
const btnAtacr = { x: 1000 - 140, y: Y_BOTONES, w: 110, h: 80, txt: "ATK" };
const btnInv = { x: 20, y: 100, w: 80, h: 80, txt: "🎒" };
const btnSalir = { x: 20, y: 20, w: 120, h: 50, txt: "🚪 SALIR" };

const btnIniciarSesion = { x: 400, y: 300, w: 200, h: 50, txt: "INICIAR SESIÓN" };
const btnRegistrarse = { x: 400, y: 380, w: 200, h: 50, txt: "REGISTRARSE" };

const btnMenuJugar = { x: 380, y: 300, w: 240, h: 60, txt: "EMPEZAR PARTIDA" };
const btnMenuControles = { x: 380, y: 380, w: 240, h: 60, txt: "CONTROLES" };
const btnMochilaVolver = { x: 450, y: 550, w: 100, h: 60, txt: "VOLVER" };

const teclas = {};
let toquesActivos = []; 
let entorno = []; let enemigos = []; let lagos = []; let vendedores = [];

function lanzarAviso(msg) { avisoTxt = { t: msg, frames: 120 }; }

// --- AUTENTICACIÓN Y GUARDADO ---
function ejecutarLogin() {
    if(!auth) { fallbackOffline("Iniciar Sesión"); return; }
    let email = prompt("Introduce tu Usuario / Email:");
    let password = prompt("Introduce tu Contraseña:");
    if (!email || !password) return;

    if (!email.includes("@")) email = email.trim() + "@vaquero.com";

    auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
            usuarioActual = userCredential.user;
            lanzarAviso("¡Bienvenido de nuevo!");
            cargarProgresoServidor();
        })
        .catch((error) => { alert("Error al iniciar sesión: " + error.message); });
}

function ejecutarRegistro() {
    if(!auth) { fallbackOffline("Registrarse"); return; }
    let email = prompt("Elige un Nombre de Usuario o Email:");
    let password = prompt("Elige una Contraseña:");
    if (!email || !password) return;

    if (!email.includes("@")) email = email.trim() + "@vaquero.com";

    auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
            usuarioActual = userCredential.user;
            lanzarAviso("¡Cuenta creada con éxito!");
            guardarProgresoServidor();
            estado = "MENU_PRINCIPAL";
        })
        .catch((error) => { alert("Error al registrar: " + error.message); });
}

function fallbackOffline(accion) {
    alert(`Modo Offline: No se pudo conectar a Firebase para ${accion}. Entrando como invitado.`);
    usuarioActual = { email: "Invitado@vaquero.com", uid: "local" };
    estado = "MENU_PRINCIPAL";
}

function guardarProgresoServidor() {
    if (!usuarioActual || !database) return;
    
    let nombreUsuario = usuarioActual.email.split('@')[0];
    let distActualMetros = Math.floor(distRec / 10);

    database.ref('usuarios/' + usuarioActual.uid).set({
        nombre: nombreUsuario,
        oro: oro,
        maxDistancia: Math.max(maxDistGlobal, distActualMetros),
        mochila: mochila,
        hotbar: hb
    });

    if (distActualMetros > maxDistGlobal) {
        maxDistGlobal = distActualMetros;
        database.ref('scores/' + usuarioActual.uid).set({
            nombre: nombreUsuario,
            metros: maxDistGlobal
        }).then(() => {
            database.ref('scores').orderByChild('metros').limitToLast(5).once('value', (snapshot) => {
                let lista = [];
                snapshot.forEach((childSnapshot) => {
                    lista.push(childSnapshot.val());
                });
                if(lista.length > 0) listaTops = lista.reverse();
            });
        });
    }
}

function cargarProgresoServidor() {
    if (!usuarioActual) return;
    if (!database) { estado = "MENU_PRINCIPAL"; return; }
    
    database.ref('usuarios/' + usuarioActual.uid).once('value').then((snapshot) => {
        const datos = snapshot.val();
        if (datos) {
            oro = datos.oro !== undefined ? datos.oro : 1000;
            maxDistGlobal = datos.maxDistancia || 0;
            if (datos.mochila) mochila = datos.mochila;
            if (datos.hotbar) hb = datos.hotbar;
        }
        estado = "MENU_PRINCIPAL";
    }).catch(() => { estado = "MENU_PRINCIPAL"; });
}

function iniciarMundo() {
    entorno = []; enemigos = []; lagos = []; vendedores = []; proyectiles = [];
    distRec = 0; hp = 100;
    pjY = ALTURA_SUELO - pjAlto;

    for(let i=0; i<150; i++) {
        entorno.push({ t: Math.random() > 0.5 ? "🌲" : "🪨", x: 600 + Math.random() * 60000, y: ALTURA_SUELO - 45 });
    }
    for(let i=0; i<100; i++) {
        let tipo = ["ogro", "flechero", "ladron", "chulupi"][Math.floor(Math.random()*4)];
        enemigos.push({ x: 1200 + Math.random() * 60000, y: ALTURA_SUELO - 45, hp: 150, v: true, t: tipo });
    }
    for(let i=1; i<15; i++) {
        lagos.push({ x: i * 4000, y: ALTURA_SUELO });
        vendedores.push({ x: i * 5000, y: ALTURA_SUELO - 55 });
    }
}

function obtenerPuntoVirtual(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}
function verificarColision(p, btn) { return p.x >= btn.x && p.x <= btn.x + btn.w && p.y >= btn.y && p.y <= btn.y + btn.h; }

window.addEventListener('keydown', (e) => { teclas[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', (e) => { teclas[e.key.toLowerCase()] = false; });

function actualizarToquesCelular(e) {
    toquesActivos = [];
    for (let i = 0; i < e.touches.length; i++) {
        toquesActivos.push(obtenerPuntoVirtual(e.touches[i].clientX, e.touches[i].clientY));
    }
}

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); actualizarToquesCelular(e);
    toquesActivos.forEach(punto => {
        if (estado === "LOGIN") {
            if (verificarColision(punto, btnIniciarSesion)) ejecutarLogin();
            if (verificarColision(punto, btnRegistrarse)) ejecutarRegistro();
        }
        else if (estado === "MENU_PRINCIPAL") {
            if (verificarColision(punto, btnMenuJugar)) { iniciarMundo(); estado = "JUEGO"; }
            if (verificarColision(punto, btnMenuControles)) { controlTactil = !controlTactil; }
        }
        else if (estado === "MOCHILA") {
            if (verificarColision(punto, btnMochilaVolver)) { estado = "JUEGO"; }
        }
        else if (estado === "JUEGO") {
            for (let i = 0; i < 9; i++) {
                let rx = 230 + i * 65;
                if (punto.x >= rx && punto.x <= rx + 60 && punto.y >= 530 && punto.y <= 590) { slotSel = i; }
            }
            if (controlTactil && verificarColision(punto, btnInv)) { estado = "MOCHILA"; }
            if (verificarColision(punto, btnSalir)) {
                guardarProgresoServidor();
                lanzarAviso("¡PROGRESO GUARDADO!");
                estado = "MENU_PRINCIPAL";
            }
        }
    });
}, { passive: false });

canvas.addEventListener('touchmove', (e) => { e.preventDefault(); actualizarToquesCelular(e); }, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); actualizarToquesCelular(e); }, { passive: false });

canvas.addEventListener('mousedown', (e) => {
    const punto = obtenerPuntoVirtual(e.clientX, e.clientY);
    toquesActivos = [punto];
    if (estado === "LOGIN") {
        if (verificarColision(punto, btnIniciarSesion)) ejecutarLogin();
        if (verificarColision(punto, btnRegistrarse)) ejecutarRegistro();
    }
    else if (estado === "MENU_PRINCIPAL") {
        if (verificarColision(punto, btnMenuJugar)) { iniciarMundo(); estado = "JUEGO"; }
        if (verificarColision(punto, btnMenuControles)) { controlTactil = !controlTactil; }
    }
    else if (estado === "MOCHILA") {
        if (verificarColision(punto, btnMochilaVolver)) { estado = "JUEGO"; }
    }
    else if (estado === "JUEGO") {
        for (let i = 0; i < 9; i++) {
            let rx = 230 + i * 65;
            if (punto.x >= rx && punto.x <= rx + 60 && punto.y >= 530 && punto.y <= 590) { slotSel = i; }
        }
        if (controlTactil && verificarColision(punto, btnInv)) { estado = "MOCHILA"; }
        if (verificarColision(punto, btnSalir)) {
            guardarProgresoServidor();
            lanzarAviso("¡PROGRESO GUARDADO!");
            estado = "MENU_PRINCIPAL";
        }
    }
});
canvas.addEventListener('mouseup', () => { toquesActivos = []; });

function dibujarBoton(btn, color) {
    let presionado = toquesActivos.some(p => verificarColision(p, btn));
    ctx.fillStyle = presionado ? "#666" : color;
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
    ctx.fillStyle = "#fff"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(btn.txt, btn.x + btn.w/2, btn.y + btn.h/2);
}

function bucle() { actualizar(); renderizar(); requestAnimationFrame(bucle); }

function actualizar() {
    if (estado !== "JUEGO") return;

    velX = 0; let ejecutarAtaque = false;
    let tocandoIzq = toquesActivos.some(p => verificarColision(p, btnIzq));
    let tocandoDer = toquesActivos.some(p => verificarColision(p, btnDer));
    let tocandoSalto = toquesActivos.some(p => verificarColision(p, btnSalto));
    let tocandoAtk = toquesActivos.some(p => verificarColision(p, btnAtacr));

    if (controlTactil) {
        if (tocandoIzq) velX = -6;
        if (tocandoDer) velX = 6;
        if (tocandoSalto && enSuelo) { velY = -13; enSuelo = false; }
        if (tocandoAtk) { ejecutarAtaque = true; toquesActivos = toquesActivos.filter(p => !verificarColision(p, btnAtacr)); } 
    } 
    
    if (teclas['a'] || teclas['arrowleft']) velX = -6;
    if (teclas['d'] || teclas['arrowright']) velX = 6;
    if ((teclas[' '] || teclas['w'] || teclas['arrowup']) && enSuelo) { velY = -13; enSuelo = false; }
    if (teclas['f']) { ejecutarAtaque = true; teclas['f'] = false; }

    velY += GRAVEDAD; if (velY > 14) velY = 14;
    distRec += velX; if (distRec < 0) distRec = 0;
    pjY += velY;

    if (pjY >= ALTURA_SUELO - pjAlto) { pjY = ALTURA_SUELO - pjAlto; velY = 0; enSuelo = true; }

    if (ejecutarAtaque) {
        let item = hb[slotSel]; let inf = INFO_ITEMS[item] || {};
        if (item === "Arco") {
            let idxFlecha = mochila.indexOf("Flecha");
            if (idxFlecha !== -1) { proyectiles.push({ x: pjX + 40, y: pjY + 30, v: 15 }); mochila.splice(idxFlecha, 1); } 
            else { lanzarAviso("¡SIN FLECHAS!"); }
        }
        else if (inf.heal) { hp = Math.min(100, hp + inf.heal); hb[slotSel] = null; lanzarAviso("¡CURADO!"); }
        else if (item === "Caña de Pescar") {
            let cercaLago = lagos.some(l => Math.abs((l.x - distRec + pjX) - pjX) < 150);
            if (cercaLago) { let pez = Math.random() < 0.7 ? "Pez" : "Piraña"; mochila.push(pez); lanzarAviso("¡PESCASTE UN " + pez.toUpperCase() + "!"); } 
            else { lanzarAviso("NO HAY AGUA CERCA"); }
        }
        else {
            let daño = inf.dmg || 15;
            enemigos.forEach(e => {
                let ex = e.x - distRec + pjX;
                if (e.v && Math.abs(ex - pjX) < 90) { e.hp -= daño; lanzarAviso("¡GOLPE! -" + daño); if (e.hp <= 0) { e.v = false; oro += 100; } }
            });
        }
    }

    proyectiles.forEach((p, index) => {
        p.x += p.v; if (p.x > 1000) proyectiles.splice(index, 1);
        enemigos.forEach(e => {
            let ex = e.x - distRec + pjX;
            if (e.v && Math.abs(ex - p.x) < 40) { e.hp -= 150; e.v = e.hp <= 0; if (!e.v) oro += 100; proyectiles.splice(index, 1); lanzarAviso("¡CRÍTICO CON ARCO!"); }
        });
    });

    enemigos.forEach(e => {
        let ex = e.x - distRec + pjX;
        if (e.v && Math.abs(pjX - ex) < 40 && Math.abs(pjY - e.y) < 50) {
            hp -= 0.4; 
            if (hp <= 0) { 
                guardarProgresoServidor(); 
                lanzarAviso("¡HAS MUERTO! PROGRESO GUARDADO"); 
                estado = "MENU_PRINCIPAL"; 
            }
        }
    });

    if (avisoTxt.frames > 0) avisoTxt.frames--;
}

function renderizar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (estado === "LOGIN") {
        ctx.fillStyle = "#14141e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffd700"; ctx.font = "bold 45px serif"; ctx.textAlign = "center";
        ctx.fillText("GUERRERO 63KM", canvas.width/2, 160);
        ctx.fillStyle = "#fff"; ctx.font = "16px monospace";
        ctx.fillText("Inicia sesión para proteger tu inventario, oro y récords globales", canvas.width/2, 220);

        dibujarBoton(btnIniciarSesion, "#325c87");
        dibujarBoton(btnRegistrarse, "#327832");
    }
    else if (estado === "MENU_PRINCIPAL") {
        ctx.fillStyle = "#14141e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffd700"; ctx.font = "bold 50px serif"; ctx.textAlign = "center";
        ctx.fillText("GUERRERO 63KM", canvas.width/2, 120);
        
        ctx.fillStyle = "#777"; ctx.font = "14px monospace";
        ctx.fillText(`Conectado como: ${usuarioActual ? usuarioActual.email.split('@')[0] : "Anónimo"}`, canvas.width/2, 160);
        ctx.fillStyle = "#5cbe7a";
        ctx.fillText(`Tu récord histórico guardado: ${maxDistGlobal} m`, canvas.width/2, 195);

        ctx.fillStyle = "rgba(255, 255, 255, 0.04)"; ctx.fillRect(660, 240, 290, 280);
        ctx.strokeStyle = "#ffd700"; ctx.strokeRect(660, 240, 290, 280);
        ctx.fillStyle = "#ffd700"; ctx.font = "bold 16px monospace";
        ctx.fillText("🏆 TOP 5 MUNDIAL", 805, 275);

        ctx.fillStyle = "#fff"; ctx.font = "14px monospace";
        listaTops.forEach((jugador, i) => {
            ctx.textAlign = "left"; ctx.fillText(`${i + 1}. ${jugador.nombre}`, 680, 320 + (i * 35));
            ctx.textAlign = "right"; ctx.fillText(`${jugador.metros}m`, 930, 320 + (i * 35));
        });

        dibujarBoton(btnMenuJugar, "#327832");
        dibujarBoton(btnMenuControles, "#555");
    }
    else if (estado === "MOCHILA") {
        ctx.fillStyle = "#1e1e28"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff"; ctx.font = "24px monospace"; ctx.textAlign = "left";
        ctx.fillText("🎒 MOCHILA (PROGRESS SAVED)", 100, 80);

        for(let i=0; i<24; i++) {
            let x = 100 + (i % 6) * 140; let y = 130 + Math.floor(i / 6) * 90;
            ctx.fillStyle = "#333"; ctx.fillRect(x, y, 110, 70); ctx.strokeStyle = "#777"; ctx.strokeRect(x, y, 110, 70);
            if(mochila[i]) { ctx.font = "25px monospace"; ctx.textAlign = "center"; ctx.fillText(INFO_ITEMS[mochila[i]]?.ico || "?", x + 55, y + 42); }
        }
        dibujarBoton(btnMochilaVolver, "#963232");
    }
    else if (estado === "JUEGO") {
        ctx.fillStyle = "#87ceeb"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let offsetBloques = distRec % TAMANIO_BLOQUE;
        for (let f = 0; f < MAPA_ESTRUCTURA.length; f++) {
            for (let c = 0; c < (canvas.width / TAMANIO_BLOQUE) + 2; c++) {
                let bx = c * TAMANIO_BLOQUE - offsetBloques; let by = f * TAMANIO_BLOQUE + 450;
                ctx.fillStyle = (f === 0) ? "#5c9e32" : "#6e5039"; ctx.fillRect(bx, by, TAMANIO_BLOQUE, TAMANIO_BLOQUE);
                ctx.strokeStyle = "#4d3322"; ctx.strokeRect(bx, by, TAMANIO_BLOQUE, TAMANIO_BLOQUE);
            }
        }
        lagos.forEach(l => { let lx = l.x - distRec + pjX; ctx.fillStyle = "#1d5fad"; ctx.fillRect(lx, l.y, 400, 180); });
        ctx.textAlign = "center";
        entorno.forEach(o => { let ox = o.x - distRec + pjX; ctx.font = "40px monospace"; ctx.fillText(o.t, ox, o.y); });
        vendedores.forEach(v => { let vx = v.x - distRec + pjX; ctx.font = "50px monospace"; ctx.fillText("🪙", vx, v.y); });
        ctx.fillStyle = "#ff8c00"; proyectiles.forEach(p => { ctx.fillRect(p.x, p.y, 20, 5); });

        enemigos.forEach(e => {
            if (!e.v) return;
            let ex = e.x - distRec + pjX; ctx.font = "45px monospace"; ctx.fillText(ENEMIGOS_ICOS[e.t], ex, e.y);
            ctx.fillStyle = "red"; ctx.fillRect(ex - 25, e.y - 50, 50, 6);
            ctx.fillStyle = "green"; ctx.fillRect(ex - 25, e.y - 50, (e.hp / 150) * 50, 6);
        });

        ctx.font = "60px monospace"; ctx.fillText("🤠", pjX, pjY + 50);

        ctx.fillStyle = "rgba(0, 0, 0, 0.4)"; ctx.fillRect(10, 10, 300, 80);
        ctx.fillStyle = "#fff"; ctx.font = "bold 13px monospace"; ctx.textAlign = "left";
        ctx.fillText(`💰 ORO PARTIDA: ${oro}`, 20, 30);
        ctx.fillText(`🏁 DISTANCIA: ${Math.floor(distRec / 10)} m`, 20, 50);
        ctx.fillStyle = "red"; ctx.fillRect(20, 65, 200, 10);
        ctx.fillStyle = "#00ff00"; ctx.fillRect(20, 65, hp * 2, 10);

        for (let i = 0; i < 9; i++) {
            let rx = 230 + i * 65;
            ctx.fillStyle = (i === slotSel) ? "#555" : "rgba(0,0,0,0.6)"; ctx.fillRect(rx, 530, 60, 60);
            ctx.strokeStyle = (i === slotSel) ? "#ffd700" : "#fff"; ctx.lineWidth = (i === slotSel) ? 3 : 1; ctx.strokeRect(rx, 530, 60, 60);
            if (hb[i]) { ctx.font = "24px monospace"; ctx.textAlign = "center"; ctx.fillText(INFO_ITEMS[hb[i]]?.ico || "", rx + 30, 568); }
        }

        if (controlTactil) {
            dibujarBoton(btnIzq, "#444"); dibujarBoton(btnDer, "#444");
            dibujarBoton(btnSalto, "#444"); dibujarBoton(btnAtacr, "#a83232"); dibujarBoton(btnInv, "#444");
        }
        
        dibujarBoton(btnSalir, "#963232");
    }

    if (avisoTxt.frames > 0) {
        ctx.fillStyle = "yellow"; ctx.font = "bold 18px monospace"; ctx.textAlign = "center";
        ctx.fillText(avisoTxt.t, canvas.width / 2, 230);
    }
}

bucle();
</script>
